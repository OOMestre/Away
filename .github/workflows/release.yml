name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0 or v0.1.0-beta.1)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Tests
        run: swift test

      - name: Determine Release Version
        id: check-prerelease
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" || "$TAG_NAME" == "staging" ]]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if [[ "$TAG_NAME" == *"beta"* || "$TAG_NAME" == *"rc"* || "$TAG_NAME" == *"alpha"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "app_name=Away Staging" >> $GITHUB_OUTPUT
            echo "bundle_identifier=com.oomestre.away.staging" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "app_name=Away" >> $GITHUB_OUTPUT
            echo "bundle_identifier=com.oomestre.away" >> $GITHUB_OUTPUT
          fi

      - name: Build Staging / Release Bundle
        env:
          AWAY_RELEASE_TAG: ${{ steps.check-prerelease.outputs.tag_name }}
          AWAY_APP_NAME: ${{ steps.check-prerelease.outputs.app_name }}
          AWAY_BUNDLE_IDENTIFIER: ${{ steps.check-prerelease.outputs.bundle_identifier }}
          AWAY_NO_OPEN: "1"
        run: ./scripts/build-staging.sh

      - name: Package App as DMG
        env:
          AWAY_APP_NAME: ${{ steps.check-prerelease.outputs.app_name }}
        run: |
          ./scripts/create-dmg.sh "dist/${AWAY_APP_NAME}.app" "Away-macOS.dmg" "${AWAY_APP_NAME}"

      - name: Extract Release Notes from CHANGELOG
        env:
          TAG_NAME: ${{ steps.check-prerelease.outputs.tag_name }}
        run: |
          mkdir -p dist
          swift scripts/extract-changelog-notes.swift "$TAG_NAME" > dist/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check-prerelease.outputs.tag_name }}
          name: ${{ steps.check-prerelease.outputs.tag_name }}
          body_path: dist/release-notes.md
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease == 'true' }}
          files: Away-macOS.dmg
